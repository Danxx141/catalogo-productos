<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore | Catálogo de productos</title>

  <!-- Bootstrap e íconos primero, después mi CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-body-tertiary">
  <!-- Barra de navegación -->
  <nav class="navbar navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-cpu-fill text-primary"></i> TechStore
      </a>
      <span class="navbar-text small" id="contador-nav"></span>
    </div>
  </nav>

  <!-- Encabezado -->
  <header class="hero text-white text-center py-5 mb-4">
    <div class="container">
      <h1 class="display-5 fw-bold">Catálogo de productos</h1>
      <p class="lead mb-0">Encontrá tecnología por categoría o según tu presupuesto.</p>
    </div>
  </header>

  <main class="container">
    <!-- Filtros -->
    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-4 align-items-end">
          <!-- Paso 3: botones de categoría (se generan con JavaScript) -->
          <div class="col-lg-7">
            <h2 class="h6 text-uppercase text-secondary fw-bold">
              <i class="bi bi-funnel"></i> Categorías
            </h2>
            <div id="botones-categoria" class="d-flex flex-wrap gap-2"></div>
          </div>

          <!-- Paso 4: filtro por precio máximo -->
          <div class="col-lg-5">
            <h2 class="h6 text-uppercase text-secondary fw-bold">
              <i class="bi bi-cash-coin"></i> Precio máximo
            </h2>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" id="input-precio" class="form-control" placeholder="Ej: 300" min="0">
              <button id="btn-precio" class="btn btn-primary">
                <i class="bi bi-search"></i> Filtrar
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Paso 2: aquí se inyectan las tarjetas -->
    <p id="resultado" class="text-secondary"></p>
    <div id="lista-productos" class="row g-4 mb-5"></div>
  </main>

  <footer class="bg-dark text-white-50 text-center py-3">
    <small>TechStore · Proyecto del bootcamp Desarrollador Web Front-End · Kodigo</small>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
